version: 1
enabled: true
required_checks:
  - vet
  - test
  - build-linux-amd64
  - build-linux-arm64
  - build-darwin-amd64
  - build-darwin-arm64
blocking:
  - paths: [internal/rollout/**]
    reason: Installation writes may damage files before a revert lands
  - paths: [internal/reap/**, internal/pipeline/reap*.go]
    reason: Reap closes live panes; a wrong close loses a worker's context that git revert cannot restore
  - paths: [internal/policy/**, .mergewake/**, .github/workflows/**]
    reason: Verification controls can admit unsafe actions before recovery
review_gate:
  land: graded
fast_lane:
  max_changed_lines: 50

deploy_approval:
  - paths: [internal/rollout/**, internal/pipeline/deploy_approval.go, internal/pipeline/pipeline.go, internal/pipeline/rollout_window.go, internal/pipeline/container_release.go, internal/integrations/deploy_decision.go, internal/config/**]
    reason: Deployment and approval controls
