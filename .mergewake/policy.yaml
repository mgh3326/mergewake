version: 1
enabled: false
required_checks:
  - vet
  - test
  - build-linux-amd64
  - build-linux-arm64
  - build-darwin-amd64
  - build-darwin-arm64
blocking:
  - paths: [internal/rollout/**]
    reason: Installation writes may damage files before a revert lands
  - paths: [internal/policy/**, .mergewake/**, .github/workflows/**]
    reason: Verification controls can admit unsafe actions before recovery
