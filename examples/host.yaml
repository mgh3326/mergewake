version: 1
host: host-a
state_dir: ~/.local/state/mergewake
token_env: GITHUB_TOKEN
poll_interval: 60s
watch_limit: 100
repos:
  - name: example/project
    branch: main
    policy: .mergewake/policy.yaml
    root: ~/.local/share/example-tools
    deny:
      - bin/relay-hub
      - bin/operator-daemon
    install:
      - source: scripts/tool
        target: bin/tool
        mode: "0755"
    smoke:
      command: ./bin/tool
      args: [--version]
    smoke_timeout: 30s
    task: "42"
review:
  login: review-bot
  timeout: 10m
  quota: scopefuel
  default_grade: B
  # pace (default): free models, then pools projected well under 100% at their
  # reset (otherwise wasted), then the rest under 100%; tight or unmeasured
  # pools are skipped. rank: keep the quota tool's recommendation order.
  select: pace
  # Optional fixed order for other-family reviewers; it takes precedence over
  # pace order but never admits a skipped pool.
  # pairings:
  #   openai: [claude, deepseek]
  profiles:
    claude:
      family: anthropic
      command: pi
      args: [--provider, anthropic, --model, claude-model-id, --thinking, high]
      gate_profile: example-claude-profile
      gate_effort: high
    deepseek:
      family: deepseek
      command: cmd
      args: [--model, deepseek-model-id, --effort, high]
      gate_profile: example-deepseek-profile
      gate_effort: high
    gemini:
      family: google
      command: agy
      args: [--model, gemini-model-id]
      gate_profile: example-gemini-profile
    grok:
      family: xai
      command: grok
      args: [--model, grok-model-id, --effort, high]
      gate_profile: example-grok-profile
      gate_effort: high
outcomes:
  command: scopefuel
  default_tier: T1
notifier:
  type: stdout
  command: panewire
  lane: operator-desk
sink:
  type: noop
  command: handoffkeep
  reopen_state: reopened
# All daemon roles are optional and shadow by default. Opting into action also
# needs --apply; land/watch still obey the repository policy.
daemon:
  act: false
  pr: {enabled: false, interval: 60s}
  watch: {enabled: false, interval: 60s}
  release: {enabled: false, interval: 2m}
  rollout: {enabled: false, interval: 2m}
# Session hosts scanned by `mergewake reap`. An empty/local ssh value means this
# machine; `jobs` is the base directory of per-pane job dirs and must be
# absolute on ssh hosts.
hosts:
  - {name: desk, jobs: ~/work/herdr-inbox/jobs}
  - {name: node, ssh: ops@node.example, jobs: /home/ops/herdr-inbox/jobs}
# Close panes that worked on merged PRs (their report.md or last screen is
# saved under jobs first), then remove the worktree and local branch after
# worktree_after with no revert. Default protect list: *-integrator,
# director-*, fleet-tooling-*, consult-*, cmd. Unnamed panes and panes outside
# a linked worktree are always protected.
reap:
  enabled: false
  act: false # reap's own acting opt-in; needs enabled, plus --apply or daemon
  worktree_after: 168h
  scan_after: 720h # merged-PR discovery window; older PRs arrive via receipts
  protect: []
  regenerable: [] # gitignored paths safe to delete with a worktree (defaults:
  # .venv, node_modules, __pycache__, .pytest_cache, dist, build, target, obj,
  # bin, Library, Temp, Logs, UserSettings); anything else refuses removal
