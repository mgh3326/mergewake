version: 1
host: host-a
state_dir: ~/.local/state/mergewake
token_env: GITHUB_TOKEN
poll_interval: 60s
watch_limit: 100
repos:
  - name: example/project
    branch: main
    policy: .mergewake/policy.yaml
    root: ~/.local/share/example-tools
    task: "42"
    # Per-repo additions to reap.regenerable (validated like the global list;
    # a trailing / is an explicit top-level directory approval). Empty means
    # the global list. Example: panewire alone approves its .local/ test
    # state dir here instead of the fleet-wide defaults.
    # reap:
    #   regenerable: ['.local/']
review:
  login: review-bot
  timeout: 10m
  default_grade: B
  # Grade asked for round 1 of a PR, by PR grade (default shown); later rounds ask at the PR grade.
  # first_round_grade: {B: A, C: B}
  # Optional fixed order for other-family reviewers.
  # pairings:
  #   openai: [claude, deepseek]
  profiles:
    claude:
      family: anthropic
      command: pi
      args: [--provider, anthropic, --model, claude-model-id, --thinking, high]
      gate_profile: example-claude-profile
      gate_effort: high
    deepseek:
      family: deepseek
      command: cmd
      args: [--model, deepseek-model-id, --effort, high]
      gate_profile: example-deepseek-profile
      gate_effort: high
    gemini:
      family: google
      command: agy
      args: [--model, gemini-model-id]
      gate_profile: example-gemini-profile
    grok:
      family: xai
      command: grok
      args: [--model, grok-model-id, --effort, high]
      gate_profile: example-grok-profile
      gate_effort: high
outcomes:
  command: panewire
  default_tier: T1
notifier:
  type: stdout
  command: panewire
  lane: operator-desk
  # Lane that owns mergewake's own automation (lost reviews, exhausted
  # retries). Empty means the desk lanes above: uncomment to route those
  # notices elsewhere, e.g. the design lane.
  # tool_lane: operator-desk
sink:
  type: noop
  command: handoffkeep
  reopen_state: reopened
# All daemon roles are optional and shadow by default. Opting into action also
# needs --apply; land/watch still obey the repository policy.
daemon:
  act: false
  # notify defaults to enabled; BLOCKED lane events fire even in shadow; READY is recorded only.
  pr: {enabled: false, interval: 60s, notify: {enabled: true}}
  watch: {enabled: false, interval: 60s}
  # Optional GitHub webhook receiver: signed deliveries wake roles early while
  # polling stays complete. Loopback listen only — put an operator-run tunnel
  # in front for real deliveries. The secret lives in the named env var.
  webhook: {enabled: false, listen: 127.0.0.1:9477, path: /github, secret_env: MERGEWAKE_WEBHOOK_SECRET}
# Optional Discord feed: PR, CI and revert events for every repo above.
# webhooks_file is a mode-0600 env file of KEY=URL lines; kinds name its keys.
# A URL inline here is refused. See docs/config.md.
discord:
  enabled: false
  webhooks_file: ~/.config/mergewake/discord-webhooks.env
  kinds:
    pr: DISCORD_WEBHOOK_PR_LOG
    ci: DISCORD_WEBHOOK_GITHUB_ACTION
    revert: DISCORD_WEBHOOK_DEPLOY_LOG
  opt_out: []
# Session hosts scanned by `mergewake reap`. An empty/local ssh value means this
# machine; `jobs` is the base directory of per-pane job dirs and must be
# absolute on ssh hosts.
hosts:
  - {name: desk, jobs: ~/work/herdr-inbox/jobs}
  - {name: node, ssh: ops@node.example, jobs: /home/ops/herdr-inbox/jobs}
# Panes are never closed here: panewire's node closes an ended job's pane, and
# reap removes the worktree and local branch after worktree_after with no
# revert, once no pane uses them anymore.
reap:
  enabled: false
  act: false # reap's own acting opt-in; needs enabled, plus --apply or daemon
  worktree_after: 168h
  scan_after: 720h # merged-PR discovery window; older PRs arrive via receipts
  legacy_every: 24h # daemon's legacy sweep per repo; 0 or off disables it
  regenerable: [] # gitignored paths safe to delete with a worktree (defaults:
  # .venv, node_modules, __pycache__, .pytest_cache, dist, build, target, obj,
  # bin, Library, Temp, Logs, UserSettings, plus directory forms .venv/,
  # node_modules/, __pycache__/, .pytest_cache/, Library/ and Temp/); a
  # trailing / approves the whole top-level directory, so list only tool-owned
  # dirs — anything else refuses removal
