name: Deploy
on:
  workflow_run:
    workflows: ["CI post-merge"]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      packages:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  test-race:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ (github.event_name == 'workflow_run' && vars.PANEWIRE_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: go test -race
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ -n "$PACKAGES" ]; then
            read -r -a packages <<< "$PACKAGES"
            go test -race "${packages[@]}"
          else
            go test -race ./...
          fi
  test-macos:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ (github.event_name == 'workflow_run' && vars.PANEWIRE_POST_MAC_RUNNER) || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: go test
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ -n "$PACKAGES" ]; then
            read -r -a packages <<< "$PACKAGES"
            go test "${packages[@]}"
          else
            go test ./...
          fi
  release-build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ (github.event_name == 'workflow_run' && vars.PANEWIRE_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build and verify release assets
        env:
          TARGET_SHA: ${{ inputs.ref || github.event.workflow_run.head_sha }}
        run: |
          tag="v0.0.0-ci.$TARGET_SHA"
          sh scripts/build-release.sh "$tag" dist/release
          sh scripts/verify-release.sh "$tag" dist/release
  status:
    needs: [test-race, test-macos, release-build]
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post deploy-ok
        run: |
          if echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            STATE=success
          else
            STATE=failure
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" -f context=deploy-ok -f target_url="$RUN_URL" \
            -f description="deploy stage: $STATE"
          [ "$STATE" = success ]
