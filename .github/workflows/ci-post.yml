name: CI post-merge
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ci-post-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  vet:
    runs-on: ${{ vars.PANEWIRE_POST_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ vars.PANEWIRE_POST_LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go build -trimpath -ldflags='-s -w' -o dist/mergewake-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/mergewake
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
  test-race:
    runs-on: ${{ vars.PANEWIRE_POST_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go test -race ./...
  test-macos:
    runs-on: ${{ vars.PANEWIRE_POST_MAC_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go test ./...
  mysql8-store:
    runs-on: ${{ vars.PANEWIRE_POST_LINUX_RUNNER || 'ubuntu-latest' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: mergewake_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go test -race -p 2 -v ./internal/server/...
        env:
          MERGEWAKE_TEST_MYSQL_DSN: root:disposable-ci-password@tcp(127.0.0.1:3306)/mergewake_test?parseTime=true
  auto-tag-test:
    runs-on: ${{ vars.PANEWIRE_POST_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: python3 scripts/test-auto-tag.py
      - run: python3 scripts/test-repair-release.py
  ci-ok:
    needs: [vet, build, test-race, test-macos, mysql8-store, auto-tag-test]
    if: ${{ always() && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
