name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go-cached
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go-cached
      - run: go test ./...
      - run: python3 scripts/test-auto-tag.py
      - run: python3 scripts/test-repair-release.py
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go-cached
      - run: go build -trimpath -ldflags='-s -w' -o dist/mergewake-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/mergewake
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
