name: Server store
on:
  pull_request:
    paths: ['internal/server/**', 'go.mod', 'go.sum', '.github/workflows/server-store.yml']
  push:
    branches: [main]
    paths: ['internal/server/**', 'go.mod', 'go.sum', '.github/workflows/server-store.yml']
permissions:
  contents: read
jobs:
  mysql8:
    name: mysql8-store
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: mergewake_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go test -race -p 2 -v ./internal/server/...
        env:
          MERGEWAKE_TEST_MYSQL_DSN: root:disposable-ci-password@tcp(127.0.0.1:3306)/mergewake_test?parseTime=true
