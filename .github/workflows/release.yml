name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-build pinned release binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags="-s -w -X main.version=$GITHUB_REF_NAME -X main.commit=$GITHUB_SHA" \
              -o "dist/mergewake-${target%/*}-${target#*/}" ./cmd/mergewake
          done
          cd dist
          sha256sum mergewake-* > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mergewake-* dist/SHA256SUMS --verify-tag --generate-notes
