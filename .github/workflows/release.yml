name: Release

# A v* tag builds the four static release binaries (linux/darwin x amd64/arm64)
# plus SHA256SUMS and publishes them to the tag's GitHub Release with
# GITHUB_TOKEN. Pull requests and manual runs build the same assets for a
# dry-run tag (v0.0.0-dryrun.<run>) and check checksums and `mergewake --version`
# without publishing anything. Hosts pull published assets themselves; this
# workflow never reaches a host.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Resolve release tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.0.0-dryrun.$RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Build release assets
        run: sh scripts/build-release.sh "$RELEASE_TAG" dist/release
      - name: Verify assets, SHA256SUMS and version output
        run: |
          sh scripts/verify-release.sh "$RELEASE_TAG" dist/release
          cat dist/release/SHA256SUMS
      - name: Keep assets for publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  test:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  publish:
    needs: [build, test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
